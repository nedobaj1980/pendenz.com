name: Apply audit patches

on:
  push:
    branches:
      - chatgpt/full-audit-2026-09-15
    paths:
      - tools/audit_patch_pendenzen.py
      - tools/fix_audit_patcher.py
      - .github/workflows/apply-audit-patches.yml

permissions:
  contents: write

jobs:
  patch-pendenzen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/full-audit-2026-09-15

      - name: Repair patch matcher
        run: python3 tools/fix_audit_patcher.py

      - name: Apply audited patch
        run: python3 tools/audit_patch_pendenzen.py

      - name: PHP syntax check
        run: php -l pages/pendenzen.php

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pages/pendenzen.php; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/pendenzen.php
          git commit -m "security: harden pendenzen access and state changes"
          git push origin HEAD:chatgpt/full-audit-2026-09-15
