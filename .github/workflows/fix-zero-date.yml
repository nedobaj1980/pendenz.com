name: Fix MySQL 8 zero date query

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-zero-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Liegenschaftsabrechnung zero-date queries
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/liegenschaftsabrechnung/index.php')
          text = path.read_text(encoding='utf-8')
          old1 = "SELECT DISTINCT YEAR(buchungsdatum) AS yr FROM liegenschafts_konto WHERE buchungsdatum IS NOT NULL AND buchungsdatum != '0000-00-00' ORDER BY yr DESC"
          new1 = "SELECT DISTINCT YEAR(buchungsdatum) AS yr FROM liegenschafts_konto WHERE YEAR(buchungsdatum) BETWEEN 2000 AND 2099 ORDER BY yr DESC"
          old2 = "SELECT DISTINCT YEAR(buchungsdatum) as yr FROM liegenschafts_konto WHERE (projekt_id = $pid OR liegenschaft_id = $pid) ORDER BY buchungsdatum DESC LIMIT 1"
          new2 = "SELECT DISTINCT YEAR(buchungsdatum) as yr FROM liegenschafts_konto WHERE (projekt_id = $pid OR liegenschaft_id = $pid) AND YEAR(buchungsdatum) BETWEEN 2000 AND 2099 ORDER BY buchungsdatum DESC LIMIT 1"
          if old1 not in text:
              raise SystemExit('Erste Zero-Date-Abfrage nicht gefunden; Abbruch ohne Änderung.')
          if old2 not in text:
              raise SystemExit('Zweite Jahres-Abfrage nicht gefunden; Abbruch ohne Änderung.')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "ChatGPT ProjectSync Fix"
          git config user.email "actions@users.noreply.github.com"
          git add tools/liegenschaftsabrechnung/index.php
          git commit -m "Fix MySQL 8 zero-date handling in Liegenschaftsabrechnung"
          git push
